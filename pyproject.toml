[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pletopay"
version = "1.0.0"
description = "Official Python SDK for the Pletopay API: bank-transfer payments, virtual accounts, transfers, checkout and signed webhooks for Nigeria."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Pletopay", email = "developers@pletopay.com" }]
keywords = ["pletopay", "payments", "nigeria", "bank transfer", "virtual account", "checkout", "webhooks", "api", "sdk"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "typing_extensions>=4.10",
]

[project.urls]
Homepage = "https://docs.pletopay.com"
Documentation = "https://docs.pletopay.com"
Repository = "https://github.com/pletopay/pletopay-sdk-python"
Changelog = "https://github.com/pletopay/pletopay-sdk-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/pletopay/pletopay-sdk-python/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
  "datamodel-code-generator>=0.26",
  "pyyaml>=6",
  "types-PyYAML",
  "build",
  "twine",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pletopay"]

[tool.hatch.build.targets.sdist]
include = ["src/pletopay", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["src/pletopay/types/_generated.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "W", "N"]
ignore = ["ANN401", "RUF001", "RUF002", "RUF003", "RUF012", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S101"]
"examples/**" = ["ANN", "T201"]
"scripts/**" = ["ANN", "T201"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
packages = ["pletopay"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "pletopay.types._generated"
disable_error_code = ["misc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: needs a running API and PLETOPAY_SECRET_KEY"]
filterwarnings = ["ignore:pletopay. .* did not match this SDK.s schema:UserWarning"]
