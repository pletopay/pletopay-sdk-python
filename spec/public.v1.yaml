webhooks:
  payment.created:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Event_payment_created"
            example:
              id: evt_01J8Z5X7Q9K2M4N6P8R0S2T4WB
              object: event
              type: payment.created
              api_version: 2026-09-24
              livemode: false
              created_at: 2026-09-24T18:04:12.000Z
              data:
                object:
                  id: pay_01J8Z5X7Q9K2M4N6P8R0S2T4V6
                  object: payment
                  livemode: false
                  reference: ORDER-12345
                  amount: 5000000
                  amount_received: 0
                  fee: 0
                  stamp_duty: 0
                  net_amount: 0
                  amount_refunded: 0
                  split: null
                  split_amount: 0
                  currency: NGN
                  status: created
                  payment_method: bank_transfer
                  amount_rule: exact
                  source: api
                  customer: cus_01J8Z5X7Q9K2M4N6P8R0S2T4V7
                  bank_transfer: null
                  description: "Order #12345"
                  metadata:
                    order_id: "12345"
                  failure_reason: null
                  review_reason: null
                  created_at: 2026-09-24T18:00:00.000Z
                  expires_at: 2026-09-24T18:30:00.000Z
                  succeeded_at: null
      responses:
        "200":
          description: Acknowledged. Any 2xx stops retries; anything else is retried.
      summary: payment.created
      description: |-
        A payment was created. Its account details may still be pending.

        Verify `X-PletoPay-Signature` against the raw body, de-duplicate on `X-PletoPay-Event-ID`, and respond 2xx within 10 seconds.
      parameters:
        - name: X-PletoPay-Signature
          in: header
          required: true
          description: '`t=<unix seconds>,v1=<hex HMAC-SHA256(secret, "<t>.<raw body>")>`. Reject timestamps older than 5 minutes.'
          schema:
            type: string
            example: t=1727200000,v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0ce8e108d8bd
        - name: X-PletoPay-Timestamp
          in: header
          required: true
          description: The same `t` as in the signature (unix seconds).
          schema:
            type: string
            example: "1727200000"
        - name: X-PletoPay-Event-ID
          in: header
          required: true
          description: "The event id (`evt_…`). De-duplicate on it: delivery is at least once."
          schema:
            type: string
            example: evt_01J8Z5X7Q9K2M4N6P8R0S2T4WB
        - name: X-PletoPay-Event-Type
          in: header
          required: true
          description: The event type, e.g. `payment.succeeded`.
          schema:
            type: string
            example: payment.succeeded
        - name: X-PletoPay-Delivery-ID
          in: header
          required: true
          description: The delivery (`whd_…`); the same across retries of one delivery.
          schema:
            type: string
            example: whd_01J8Z5X7Q9K2M4N6P8R0S2T4WA
