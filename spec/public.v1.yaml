    Error:
      description: Every error response. Program against `error.type` and `error.code`; `message` is for humans and may change.
      type: object
      required:
        - status
        - message
        - error
        - request_id
      properties:
        status:
          const: false
        message:
          type: string
          description: Human-readable explanation
          example: Invalid request
        error:
          type: object
          required:
            - type
            - code
          properties:
            type:
              type: string
              enum:
                - invalid_request
                - authentication_error
                - permission_error
                - not_found
                - conflict
                - idempotency_error
                - rate_limit_error
                - api_error
            code:
              type: string
              description: Stable machine-readable code (the error catalogue lists every code)
              example: parameter_invalid
            param:
              type: string
              description: The request field the error is about, when there is one
            details:
              type: object
          additionalProperties: false
        request_id:
          type: string
          example: req_01J8Z5X7Q9K2M4N6P8R0S2T4V6
