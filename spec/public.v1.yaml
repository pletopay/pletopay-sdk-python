                message: Too many requests. Retry after the indicated delay.
                error:
                  type: rate_limit_error
                  code: rate_limited
                request_id: req_01J8Z5X7Q9K2M4N6P8R0S2T4WE
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: false
                message: An unexpected error occurred
                error:
                  type: api_error
                  code: internal_error
                request_id: req_01J8Z5X7Q9K2M4N6P8R0S2T4WE
      security:
        - secretKey: []
      summary: Retrieve your balances
      tags:
        - Balance
      x-required-scopes:
        - balance:read
  /api/v1/transactions:
    get:
      description: Every ledger journal that moved your balances, with its signed effect per balance (credits to you are positive) and the object that caused it. Filter by journal `type` or by `source`. Use it for reconciliation.
      operationId: listTransactions
      parameters:
        - name: limit
          required: false
          in: query
          description: Number of objects to return
          schema:
            minimum: 1
            maximum: 100
            default: 10
            type: number
        - name: starting_after
          required: false
          in: query
          description: "Cursor: return objects created before this object id (older)"
          schema:
            type: string
        - name: ending_before
          required: false
          in: query
          description: "Cursor: return objects created after this object id (newer)"
          schema:
            type: string
        - name: created
          required: false
          in: query
          description: Filter on creation time, e.g. created[gte]=2026-01-01T00:00:00Z
          schema:
            $ref: "#/components/schemas/DateRangeFilter"
          style: deepObject
          explode: true
        - name: type
          required: false
          in: query
          schema:
            type: string
            enum:
              - payment_receipt
              - unmatched_receipt
              - unapplied_receipt
              - unapplied_application
              - suspense_assignment
              - funds_release
              - sweep
              - transfer_reserve
              - transfer_complete
              - transfer_release
              - external_debit
              - adjustment
              - reversal
              - settlement_reserve
              - settlement_complete
              - settlement_release
              - split_allocation
          description: Only objects of this type.
        - name: source
          required: false
          in: query
          description: What caused the movement
          schema:
            type: string
            enum:
              - payment
              - transfer
              - account_transaction
              - adjustment
        - name: PletoPay-Version
          in: header
          description: Dated API version. Defaults to the version pinned on your organization.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: A page of ledger transactions, newest first, in `data`. Pass `meta.next_cursor` as `starting_after` to fetch the next page; it is `null` on the last one.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                  - data
                  - meta
                properties:
                  status:
                    const: true
                  message:
                    type: string
                    description: Human-readable outcome
                    example: Request successful
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/LedgerTransaction"
                  meta:
                    $ref: "#/components/schemas/ListMeta"
              example:
                status: true
                message: Ledger transactions retrieved
                data:
                  - id: jrn_01J8Z5X7Q9K2M4N6P8R0S2T4W9
                    object: ledger_transaction
                    livemode: false
                    type: payment_receipt
                    description: Payment ORDER-12345
                    currency: NGN
                    net_amount: 4950000
                    balance_changes:
                      pending: 4950000
                    source:
                      object: payment
                      id: pay_01J8Z5X7Q9K2M4N6P8R0S2T4V6
                    created_at: 2026-09-24T18:04:12.000Z
                meta:
                  has_more: false
                  next_cursor: null
                  url: /api/v1/transactions
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: false
                message: amount must not be less than 1
                error:
                  type: invalid_request
                  code: parameter_invalid
                  param: amount
                request_id: req_01J8Z5X7Q9K2M4N6P8R0S2T4WE
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: false
                message: Invalid API key
                error:
                  type: authentication_error
                  code: invalid_api_key
                request_id: req_01J8Z5X7Q9K2M4N6P8R0S2T4WE
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: false
                message: You do not have permission to perform this action
                error:
                  type: permission_error
                  code: insufficient_permissions
                request_id: req_01J8Z5X7Q9K2M4N6P8R0S2T4WE
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: false
                message: Too many requests. Retry after the indicated delay.
                error:
                  type: rate_limit_error
                  code: rate_limited
                request_id: req_01J8Z5X7Q9K2M4N6P8R0S2T4WE
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: false
                message: An unexpected error occurred
                error:
                  type: api_error
                  code: internal_error
                request_id: req_01J8Z5X7Q9K2M4N6P8R0S2T4WE
      security:
        - secretKey: []
      summary: List ledger transactions
      tags:
        - Balance
      x-required-scopes:
        - transactions:read
  /api/v1/sandbox/simulate-transfer:
    post:
      operationId: simulateTransfer
      parameters:
        - name: PletoPay-Version
          in: header
          description: Dated API version. Defaults to the version pinned on your organization.
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateTransferDto"
            example:
              account_number: "9000002140"
              amount: 5000000
      responses:
        "202":
          description: The simulation was accepted.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                  - data
                properties:
                  status:
                    const: true
                  message:
                    type: string
                    description: Human-readable outcome
                    example: Request successful
                  data:
                    $ref: "#/components/schemas/SimulatedTransfer"
              example:
                status: true
                message: Simulated transfer simulated
                data:
                  object: simulated_transfer
                  status: accepted
                  account_number: "9000002140"
                  amount: 5000000
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: false
                message: amount must not be less than 1
                error:
                  type: invalid_request
                  code: parameter_invalid
                  param: amount
                request_id: req_01J8Z5X7Q9K2M4N6P8R0S2T4WE
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: false
                message: Invalid API key
                error:
                  type: authentication_error
                  code: invalid_api_key
                request_id: req_01J8Z5X7Q9K2M4N6P8R0S2T4WE
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: false
                message: You do not have permission to perform this action
                error:
                  type: permission_error
                  code: insufficient_permissions
                request_id: req_01J8Z5X7Q9K2M4N6P8R0S2T4WE
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: false
                message: Too many requests. Retry after the indicated delay.
                error:
                  type: rate_limit_error
                  code: rate_limited
                request_id: req_01J8Z5X7Q9K2M4N6P8R0S2T4WE
        "500":
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: false
                message: An unexpected error occurred
                error:
                  type: api_error
                  code: internal_error
                request_id: req_01J8Z5X7Q9K2M4N6P8R0S2T4WE
        "503":
          description: The service is temporarily unavailable. Nothing was sent or created; retry later with the same Idempotency-Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: false
                message: The service is temporarily unavailable. Nothing was sent or created; retry shortly.
                error:
                  type: api_error
                  code: service_unavailable
                request_id: req_01J8Z5X7Q9K2M4N6P8R0S2T4WE
      security:
        - secretKey: []
      summary: Simulate a customer bank transfer (test mode only)
      tags:
        - Sandbox
      x-required-scopes:
        - payments:write
      x-test-mode-only: true
      description: |-
        **Test mode only** (`403 test_mode_only` with a live key). Simulate a transfer into one of your test virtual accounts, as a customer would make it.

        The transfer then flows through the same pipeline as live money: the payment moves to `succeeded` and webhooks are sent. A wrong amount into an exact-amount account is refused (`400 simulation_rejected`), as a real transfer would be. An account that is not `active` (for example a one-time account that already received its payment) is refused before anything is sent (`409 virtual_account_not_active`). A `202` only means the simulation was accepted; watch the payment or its events for the outcome.
info:
  title: Pletopay API
  version: 2026-09-25
  description: |-
    Bank-transfer payment infrastructure for Nigeria: virtual accounts, payments, hosted checkout, invoices, transfers, settlements and signed webhooks.

    **Authentication**: send your secret key as `Authorization: Bearer sk_test_…` (test mode) or `sk_live_…` (live mode). Test and live data are fully separate; the key decides the mode.

    **Money**: all amounts are integers in kobo (NGN minor units). ₦50,000.00 is `5000000`.

    **Idempotency**: send an `Idempotency-Key` on creates. A retry with the same key and body returns the original response. Transfers and refunds require it.

    **Versioning**: the URL carries the major version (`/api/v1`); the dated `PletoPay-Version` header selects the minor version.

    **Errors**: every error uses the `Error` object with a stable `code`. The error catalogue (`x-error-codes` in this file) lists every code.

    **Webhooks**: every event Pletopay sends is documented with its payload. Verify `X-PletoPay-Signature` before trusting one.
  contact:
    name: Pletopay developer support
tags:
  - name: Payments
    description: "Accept a bank transfer: create a payment, show the customer the account to pay into, and get notified when the money is confirmed. Each payment gets its own single-use (dynamic) virtual account."
  - name: Virtual accounts
    description: Real bank account numbers that route money into your Pletopay balance. Dedicated accounts belong to one customer permanently; dynamic accounts serve a single payment.
  - name: Customers
    description: The people and businesses who pay you. Customers own dedicated accounts, invoices and subscriptions.
  - name: Checkout
    description: "Hosted checkout pages: redirect your customer to Pletopay, and we show the transfer details and confirm the payment."
  - name: Payment links
    description: "Reusable hosted payment pages you can share by URL: no integration needed."
  - name: Invoices
    description: Itemised invoices with a hosted payment page, paid by bank transfer.
  - name: Subscriptions
    description: Plans and recurring billing through invoices or dedicated accounts. There is no automatic debit.
  - name: Transfers
    description: Send money from your available balance to any Nigerian bank account, with name enquiry and a bank list.
  - name: Refunds
    description: Return money for a payment by bank transfer, fully or partially.
  - name: Settlements
    description: Payouts of your available balance to your settlement bank account, scheduled or on demand, itemised for reconciliation.
  - name: Subaccounts & splits
    description: "Marketplaces and platforms: give sellers their own balance and payout account, and split payments with them."
  - name: Balance
    description: Your balances and the ledger transactions behind them.
  - name: Reports
    description: CSV exports and balance statements for accounting and reconciliation.
  - name: Risk
    description: Your risk limits, risk events and per-customer risk status.
  - name: Webhooks
    description: Endpoints that receive signed events, the event log, delivery history and replays.
  - name: Sandbox
    description: Test-mode tools that simulate what customers do.
servers:
  - url: https://api.pletopay.com
    description: Production
  - url: http://localhost:8080
    description: Local development
components:
  securitySchemes:
    secretKey:
      type: http
      scheme: bearer
      bearerFormat: sk_test_… / sk_live_…
      description: Your secret API key, from Settings → Developers → API keys in the dashboard. `sk_test_` keys act on test data, `sk_live_` keys on live data. Keep it on your server.
  schemas:
    DateRangeFilter:
      type: object
      properties:
        gt:
          type: string
          format: date-time
        gte:
          type: string
          format: date-time
        lt:
          type: string
          format: date-time
        lte:
          type: string
          format: date-time
    CreateCustomerDto:
      type: object
      properties:
        email:
          type: string
          example: customer@example.com
        name:
          type: string
          example: Chidi Okeke
        phone:
          type: string
          example: "+2348012345678"
        external_id:
          type: string
          description: Your own identifier for this customer
        metadata:
          type: object
          additionalProperties:
            type: string
    UpdateCustomerDto:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        phone:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Merged into existing metadata
    PaymentCustomerDto:
      type: object
      properties:
        id:
          type: string
          description: Existing customer id (cus_…)
        email:
          type: string
          description: Creates or reuses the customer with this email
        name:
          type: string
        phone:
          type: string
    CreatePaymentDto:
      type: object
      properties:
        amount:
          type: number
          description: Amount in minor units (kobo). ₦50,000.00 = 5000000. Required when amount_rule is exact.
          example: 5000000
          minimum: 1
        currency:
          type: string
          enum:
            - NGN
          example: NGN
        reference:
          type: string
          description: Your unique reference for this payment (e.g. order id)
          example: ORDER-12345
        amount_rule:
          type: string
          enum:
            - exact
            - any
          default: exact
          description: "exact: transfers of any other amount are rejected. any: accept whatever is sent."
        customer:
          $ref: "#/components/schemas/PaymentCustomerDto"
        description:
          type: string
          maxLength: 500
        metadata:
          type: object
          additionalProperties:
            type: string
          example:
            order_id: "123"
        split:
          type: string
          description: Split rule id (spl_…) to share the net amount with subaccounts
        expires_in:
          type: number
          description: "Seconds until the payment (and its account) expires: 300 to 10800 (one-time accounts last up to 3 hours)"
          example: 1800
        expires_at:
          type: string
          format: date-time
          description: "Absolute expiry, alternative to expires_in: 5 minutes to 3 hours from now"
      required:
        - currency
        - reference
    AmountRangeFilter:
      type: object
      properties:
        gte:
          type: integer
        lte:
          type: integer
    CreateVirtualAccountDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - dedicated
            - dynamic
          description: "dedicated: permanent account for a customer. dynamic: single-use account bound to one payment."
        customer_id:
          type: string
          description: Customer id (cus_…). Required for dedicated accounts.
        amount:
          type: number
          description: "Dynamic only: amount in kobo"
          example: 5000000
        currency:
          type: string
          enum:
            - NGN
          description: Dynamic only
        reference:
          type: string
          description: "Dynamic only: your unique payment reference"
          example: ORDER-12345
        expires_at:
          type: string
          format: date-time
          description: Dynamic only
        metadata:
          type: object
          additionalProperties:
            type: string
      required:
        - type
    CloseVirtualAccountDto:
      type: object
      properties:
        reason:
          type: string
          example: Customer offboarded
      required:
        - reason
    CreateSubaccountDto:
      type: object
      properties:
        name:
          type: string
          example: Mama Ngozi Kitchen
        email:
          type: string
        bank_code:
          type: string
          example: "058"
          description: Payout bank code
        account_number:
          type: string
          example: "0123456789"
          description: Payout account (verified by name enquiry)
        metadata:
          type: object
          additionalProperties:
            type: string
      required:
        - name
        - bank_code
        - account_number
    UpdateSubaccountDto:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        status:
          type: string
          enum:
            - active
            - inactive
        bank_code:
          type: string
          description: Change the payout account (a cooldown applies before it is used)
        account_number:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    SplitAllocationDto:
      type: object
      properties:
        subaccount:
          type: string
          description: Subaccount id (sub_…)
        share:
          type: number
          description: "percentage: basis points of the net amount (2500 = 25%). flat: amount in kobo."
          example: 2500
      required:
        - subaccount
        - share
    CreateSplitRuleDto:
      type: object
      properties:
        name:
          type: string
          example: Marketplace 80/20
        type:
          type: string
          enum:
            - percentage
            - flat
        allocations:
          type: array
          items:
            $ref: "#/components/schemas/SplitAllocationDto"
        metadata:
          type: object
          additionalProperties:
            type: string
      required:
        - name
        - type
        - allocations
    UpdateSplitRuleDto:
      type: object
      properties:
        active:
          type: boolean
          description: Deactivated rules cannot be used for new payments; existing payments keep their frozen split.
      required:
        - active
    BeneficiaryDto:
      type: object
      properties:
        bank_code:
          type: string
          example: "058"
          description: Bank code from GET /api/v1/banks
        account_number:
          type: string
          example: "0123456789"
          description: 10-digit NUBAN account number
      required:
        - bank_code
        - account_number
    CreateTransferDto:
      type: object
      properties:
        amount:
          type: number
          description: Amount in kobo
          example: 2500000
          minimum: 100
        currency:
          type: string
          enum:
            - NGN
        reference:
          type: string
          example: PAYOUT-2026-0001
        narration:
          type: string
          maxLength: 50
          example: Vendor payout September
          description: Shown on the recipient's statement (at most 50 characters)
        beneficiary:
          $ref: "#/components/schemas/BeneficiaryDto"
        metadata:
          type: object
          additionalProperties:
            type: string
      required:
        - amount
        - currency
        - reference
        - narration
        - beneficiary
    NameEnquiryDto:
      type: object
      properties:
        bank_code:
          type: string
          example: "058"
        account_number:
          type: string
          example: "0123456789"
      required:
        - bank_code
        - account_number
    RefundDestinationDto:
      type: object
      properties:
        bank_code:
          type: string
          example: "058"
        account_number:
          type: string
          example: "0123456789"
      required:
        - bank_code
        - account_number
    CreateRefundDto:
      type: object
      properties:
        payment:
          type: string
          description: The original payment (pay_…)
        amount:
          type: number
          description: Amount in kobo; defaults to the full refundable amount (partial refunds allowed)
        reason:
          type: string
          example: Customer returned the item
        reference:
          type: string
          description: Your unique refund reference
        destination:
          description: Where to send the money. Defaults to the original sender when their full account details are known.
          allOf:
            - $ref: "#/components/schemas/RefundDestinationDto"
        metadata:
          type: object
          additionalProperties:
            type: string
      required:
        - payment
        - reason
    CreateCheckoutSessionDto:
      type: object
      properties:
        amount:
          type: number
          description: Amount in kobo
          example: 5000000
        currency:
          type: string
          enum:
            - NGN
        reference:
          type: string
          description: Your reference for this session, unique per mode (409 duplicate_reference if reused)
        description:
          type: string
          description: Shown to the customer
        customer:
          type: string
          description: Existing customer (cus_…)
        customer_email:
          type: string
        success_url:
          type: string
          description: Where the customer is sent after paying
        cancel_url:
          type: string
          description: Where the customer goes if they cancel
        expires_in:
          type: number
          description: "Seconds until the session expires (default 3600, at most 10800: one-time accounts last up to 3 hours)"
          maximum: 10800
        split:
          type: string
          description: Split rule applied to the payment (spl_…)
        metadata:
          type: object
          additionalProperties:
            type: string
      required:
        - amount
        - currency
    CreatePaymentLinkDto:
      type: object
      properties:
        name:
          type: string
          example: Donation
        description:
          type: string
        amount:
          type: number
          description: Fixed amount in kobo. Omit and set min/max to let the customer choose.
        min_amount:
          type: number
        max_amount:
          type: number
        max_uses:
          type: number
          description: Stop accepting payments after this many
        success_url:
          type: string
        cancel_url:
          type: string
        split:
          type: string
          description: Split rule (spl_…)
        expires_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type: string
      required:
        - name
    UpdatePaymentLinkDto:
      type: object
      properties:
        active:
          type: boolean
        name:
          type: string
        description:
          type: string
    InvoiceItemDto:
      type: object
      properties:
        description:
          type: string
          example: Website design
        quantity:
          type: number
          example: 1
        unit_amount:
          type: number
          description: Unit price in kobo
          example: 15000000
      required:
        - description
        - quantity
        - unit_amount
    InvoiceTaxDto:
      type: object
      properties:
        name:
          type: string
          example: VAT
        bps:
          type: number
          description: Rate in basis points (750 = 7.5%)
          example: 750
      required:
        - name
        - bps
    CreateInvoiceDto:
      type: object
      properties:
        customer:
          type: string
          description: Customer (cus_…)
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceItemDto"
        taxes:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceTaxDto"
        due_date:
          type: string
          format: date-time
        memo:
          type: string
        split:
          type: string
          description: Split rule (spl_…)
        metadata:
          type: object
          additionalProperties:
            type: string
      required:
        - customer
        - items
        - due_date
    UpdateInvoiceDto:
      type: object
      properties:
        customer:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceItemDto"
        taxes:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceTaxDto"
        due_date:
          type: string
          format: date-time
