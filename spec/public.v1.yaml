                status: true
                message: Virtual account created
                data:
                  id: va_01J8Z5X7Q9K2M4N6P8R0S2T4V8
                  object: virtual_account
                  livemode: false
                  type: dedicated
                  status: active
                  account_number: "9000002140"
                  account_name: Ada Stores Ltd
                  bank_name: Example Bank
                  bank_code: "090629"
                  currency: NGN
