        bank_name:
          type: string
          example: Example Bank
        bank_code:
          type: string
          example: "090629"
        virtual_account:
          type: string
          pattern: ^va_[0-9A-HJKMNP-TV-Z]{26}$
          example: va_01J8Z5X7Q9K2M4N6P8R0S2T4V6
        expires_at:
          type:
            - string
            - "null"
          format: date-time
      additionalProperties: false
    Payment:
      description: A request for money by bank transfer. `status` moves `created` → `pending` (account issued) → `succeeded` when the credit is confirmed, or to `expired`, `failed` or `under_review`.
      type: object
      required:
        - id
        - object
        - livemode
        - reference
        - amount
        - amount_received
        - fee
        - stamp_duty
        - net_amount
        - amount_refunded
        - split
        - split_amount
        - currency
        - status
        - payment_method
        - amount_rule
        - source
        - customer
        - bank_transfer
        - description
        - metadata
        - failure_reason
        - review_reason
        - created_at
        - expires_at
        - succeeded_at
      properties:
        id:
          type: string
          pattern: ^pay_[0-9A-HJKMNP-TV-Z]{26}$
          example: pay_01J8Z5X7Q9K2M4N6P8R0S2T4V6
        object:
          const: payment
        livemode:
          type: boolean
        reference:
          type: string
          example: ORDER-12345
        amount:
          type:
            - integer
            - "null"
          description: Expected amount in minor units; null when amount_rule is any
        amount_received:
          type: integer
          description: Minor units (kobo for NGN)
        fee:
          type: integer
          description: Minor units (kobo for NGN)
        stamp_duty:
          type: integer
          description: Minor units (kobo for NGN)
        net_amount:
          type: integer
          description: Minor units (kobo for NGN)
        amount_refunded:
          type: integer
          description: Total of successful refunds against this payment
        split:
          type:
            - string
            - "null"
          description: Split rule (spl_…) applied to this payment
        split_amount:
          type: integer
          description: Part of net_amount allocated to subaccounts by the split rule
        currency:
          type: string
          enum:
            - NGN
        status:
          type: string
          enum:
            - created
            - pending
            - processing
            - succeeded
            - under_review
            - failed
            - expired
            - reversed
            - partially_refunded
            - refunded
          description: partially_refunded / refunded are set only once a refund has actually been paid out.
        payment_method:
          const: bank_transfer
        amount_rule:
          type: string
          enum:
            - exact
            - any
        source:
          type: string
          enum:
            - api
            - dedicated_virtual_account
        customer:
          oneOf:
            - type: "null"
            - type: string
              pattern: ^cus_[0-9A-HJKMNP-TV-Z]{26}$
              example: cus_01J8Z5X7Q9K2M4N6P8R0S2T4V6
            - $ref: "#/components/schemas/Customer"
          description: Customer id, or the full object with expand[]=customer
        bank_transfer:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/BankTransferInstructions"
        description:
          type:
            - string
            - "null"
        metadata:
          type: object
          additionalProperties:
            type: string
          maxProperties: 50
        failure_reason:
          type:
            - string
            - "null"
        review_reason:
          type:
            - string
            - "null"
        created_at:
          type: string
          format: date-time
        expires_at:
          type:
            - string
            - "null"
          format: date-time
        succeeded_at:
          type:
            - string
            - "null"
          format: date-time
      additionalProperties: false
      example:
        id: pay_01J8Z5X7Q9K2M4N6P8R0S2T4V6
        object: payment
        livemode: false
        reference: ORDER-123
        amount: 5000000
        amount_received: 0
        fee: 0
        stamp_duty: 0
        net_amount: 0
        amount_refunded: 0
        split: null
        split_amount: 0
        currency: NGN
        status: pending
        payment_method: bank_transfer
        amount_rule: exact
        source: api
        customer: cus_01J8Z5X7Q9K2M4N6P8R0S2T4V7
        bank_transfer:
          account_number: "9000002140"
          account_name: Ada Stores Ltd
          bank_name: Example Bank
          bank_code: "090629"
          virtual_account: va_01J8Z5X7Q9K2M4N6P8R0S2T4V8
          expires_at: 2026-09-24T18:30:00.000Z
        description: null
        metadata:
          order_id: "123"
        failure_reason: null
        review_reason: null
        created_at: 2026-09-24T18:00:00.000Z
        expires_at: 2026-09-24T18:30:00.000Z
        succeeded_at: null
    VirtualAccount:
