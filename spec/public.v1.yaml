openapi: 3.1.0
paths:
  /api/v1/customers:
    post:
      operationId: createCustomer
      parameters:
        - name: PletoPay-Version
          in: header
          description: Dated API version. Defaults to the version pinned on your organization.
          required: false
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          description: "A unique key for this request (1–255 printable ASCII characters). A retry with the same key and body returns the original response, with `Idempotent-Replayed: true`, instead of acting twice. Keys expire after 24 hours."
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerDto"
            example:
              email: customer@example.com
              name: Chidi Okeke
              phone: "+2348012345678"
              external_id: user_8841
              metadata:
                signup_channel: web
      responses:
        "201":
          description: The new customer.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                  - data
                properties:
                  status:
                    const: true
                  message:
                    type: string
                    description: Human-readable outcome
                    example: Request successful
                  data:
                    $ref: "#/components/schemas/Customer"
              example:
                status: true
                message: Customer created
                data:
                  id: cus_01J8Z5X7Q9K2M4N6P8R0S2T4V7
                  object: customer
                  livemode: false
                  email: customer@example.com
                  name: Chidi Okeke
                  phone: "+2348012345678"
                  external_id: user_8841
                  risk_status: normal
                  metadata:
                    signup_channel: web
                  created_at: 2026-09-24T18:00:00.000Z
                  updated_at: 2026-09-24T18:00:00.000Z
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: false
                message: amount must not be less than 1
                error:
                  type: invalid_request
                  code: parameter_invalid
                  param: amount
                request_id: req_01J8Z5X7Q9K2M4N6P8R0S2T4WE
        "401":
          description: Missing or invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: false
                message: Invalid API key
                error:
                  type: authentication_error
                  code: invalid_api_key
                request_id: req_01J8Z5X7Q9K2M4N6P8R0S2T4WE
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: false
                message: You do not have permission to perform this action
                error:
                  type: permission_error
                  code: insufficient_permissions
                request_id: req_01J8Z5X7Q9K2M4N6P8R0S2T4WE
        "409":
          description: |-
            Conflict (duplicate reference, invalid state, request in progress)

            A request with this Idempotency-Key is still in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: false
                message: A payment with reference ORDER-12345 already exists
                error:
                  type: conflict
                  code: duplicate_reference
                  param: reference
                request_id: req_01J8Z5X7Q9K2M4N6P8R0S2T4WE
        "422":
          description: Idempotency-Key reused with a different request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: false
                message: This Idempotency-Key was used with a different request
                error:
                  type: idempotency_error
                  code: idempotency_key_reused
                  param: Idempotency-Key
                request_id: req_01J8Z5X7Q9K2M4N6P8R0S2T4WE
        "429":
          description: Rate limited
