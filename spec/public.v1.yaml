          pattern: ^we_[0-9A-HJKMNP-TV-Z]{26}$
          example: we_01J8Z5X7Q9K2M4N6P8R0S2T4V6
        message:
          type: string
      additionalProperties: false
    Event:
      description: Something that happened in your account. The same object is delivered to your webhook endpoints.
      type: object
      required:
        - id
        - object
        - type
        - api_version
        - livemode
        - created_at
        - data
      properties:
        id:
          type: string
          pattern: ^evt_[0-9A-HJKMNP-TV-Z]{26}$
          example: evt_01J8Z5X7Q9K2M4N6P8R0S2T4V6
        object:
          const: event
        type:
          type: string
          example: payment.succeeded
        api_version:
          type: string
          example: 2026-09-24
        livemode:
          type: boolean
        created_at:
          type: string
          format: date-time
        data:
          type: object
          required:
            - object
          properties:
            object:
              type: object
              description: The resource (payment, virtual_account, transfer) at the time of the event
          additionalProperties: false
      additionalProperties: false
    WebhookDelivery:
      description: One delivery of an event to an endpoint, with its retry state.
      type: object
      required:
        - id
        - object
        - livemode
        - event
        - endpoint
        - status
        - attempts
        - response_status
        - error
        - duration_ms
        - last_attempt_at
        - next_attempt_at
        - replay_of
        - created_at
      properties:
        id:
          type: string
          pattern: ^whd_[0-9A-HJKMNP-TV-Z]{26}$
          example: whd_01J8Z5X7Q9K2M4N6P8R0S2T4V6
        object:
          const: webhook_delivery
        livemode:
          type: boolean
        event:
          type: string
          pattern: ^evt_[0-9A-HJKMNP-TV-Z]{26}$
          example: evt_01J8Z5X7Q9K2M4N6P8R0S2T4V6
        endpoint:
          type: string
          pattern: ^we_[0-9A-HJKMNP-TV-Z]{26}$
          example: we_01J8Z5X7Q9K2M4N6P8R0S2T4V6
        status:
          type: string
          enum:
            - pending
            - succeeded
            - failed
            - dead
        attempts:
          type: integer
        response_status:
          type:
            - integer
            - "null"
        error:
          type:
            - string
            - "null"
        duration_ms:
          type:
            - integer
            - "null"
        last_attempt_at:
          type:
            - string
            - "null"
          format: date-time
        next_attempt_at:
          type:
            - string
            - "null"
          format: date-time
        replay_of:
          oneOf:
            - type: "null"
            - type: string
              pattern: ^whd_[0-9A-HJKMNP-TV-Z]{26}$
              example: whd_01J8Z5X7Q9K2M4N6P8R0S2T4V6
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    SimulatedTransfer:
      description: Acknowledgement that a simulated transfer was accepted.
      type: object
      required:
        - object
        - status
        - account_number
        - amount
      properties:
        object:
          const: simulated_transfer
        status:
          const: accepted
        account_number:
          type: string
        amount:
          type: integer
          description: Minor units (kobo for NGN)
      additionalProperties: false
    Settlement:
      description: A payout of available balance to a settlement account.
      type: object
      required:
        - id
        - object
        - livemode
        - subaccount
        - status
        - trigger
        - amount
        - fee
        - transfer_fee
        - transfer_fee_vat
        - stamp_duty
        - total_deducted
        - reserve_retained
        - currency
        - settlement_account
        - transfer
        - failure_reason
        - cutoff_at
        - created_at
        - completed_at
      properties:
        id:
          type: string
          pattern: ^stl_[0-9A-HJKMNP-TV-Z]{26}$
          example: stl_01J8Z5X7Q9K2M4N6P8R0S2T4V6
        object:
          const: settlement
        livemode:
          type: boolean
        subaccount:
          type:
            - string
            - "null"
          description: The subaccount paid by this settlement (sub_…), or null for your own balance
        status:
          type: string
          enum:
            - pending
            - processing
            - completed
            - failed
        trigger:
          type: string
          enum:
            - scheduled
            - manual
        amount:
          type: integer
          description: Sent to your settlement account
        fee:
          type: integer
          description: Platform settlement fee
        transfer_fee:
          type: integer
          description: Transfer fee (when passed through)
        transfer_fee_vat:
          type: integer
          description: 7.5% VAT on the transfer fee (when passed through)
        stamp_duty:
          type: integer
          description: Minor units (kobo for NGN)
        total_deducted:
          type: integer
          description: "Taken from your available balance: amount + fees"
        reserve_retained:
          type: integer
          description: Kept available by your reserve setting
        currency:
          type: string
          enum:
            - NGN
        settlement_account:
          type: object
          required:
            - id
            - bank_code
            - bank_name
            - account_number_last4
            - account_name
          properties:
            id:
              type: string
              pattern: ^sta_[0-9A-HJKMNP-TV-Z]{26}$
              example: sta_01J8Z5X7Q9K2M4N6P8R0S2T4V6
            bank_code:
              type: string
            bank_name:
              type:
                - string
                - "null"
              description: Bank name for display (null if the list of banks is unavailable)
            account_number_last4:
              type: string
              pattern: ^[0-9]{4}$
            account_name:
              type: string
          additionalProperties: false
        transfer:
          oneOf:
            - type: "null"
            - type: object
              required:
                - status
                - session_id
              properties:
                status:
                  type: string
                  enum:
                    - pending
                    - processing
                    - succeeded
                    - failed
                    - reversed
                session_id:
                  type:
                    - string
                    - "null"
              additionalProperties: false
        failure_reason:
          type:
            - string
            - "null"
        cutoff_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        completed_at:
          type:
            - string
            - "null"
          format: date-time
      additionalProperties: false
    SettlementItem:
      description: A ledger movement a settlement accounts for.
      type: object
      required:
        - object
        - ledger_transaction
        - type
        - source
        - available_delta
        - posted_at
      properties:
        object:
          const: settlement_item
        ledger_transaction:
          type: string
          description: Ledger transaction id (jrn_…)
        type:
          type: string
        source:
          oneOf:
