                  code: internal_error
                request_id: req_01J8Z5X7Q9K2M4N6P8R0S2T4WE
      security:
        - secretKey: []
      summary: List customers
      tags:
        - Customers
      x-required-scopes:
        - customers:read
      description: List your customers. Filter by `email` to find a customer you created earlier.
