          schema:
            minimum: 1
            maximum: 100
            default: 10
            type: number
        - name: starting_after
          required: false
          in: query
          description: "Cursor: return objects created before this object id (older)"
          schema:
            type: string
        - name: ending_before
          required: false
          in: query
          description: "Cursor: return objects created after this object id (newer)"
          schema:
            type: string
