x-error-codes:
  - code: refund_destination_mismatch
    status: 400
    type: invalid_request
    when: A refund destination was given that isn't the original sender's account (omit `destination`)
  - code: parameter_invalid
    status: 400
    type: invalid_request
    when: A field failed validation (`param` names it)
  - code: parameter_missing
    status: 400
    type: invalid_request
    when: A required field is missing (e.g. `amount` with `amount_rule=exact`)
  - code: unknown_parameter
    status: 400
    type: invalid_request
    when: An unknown field was sent (rejected, not ignored)
  - code: invalid_json
    status: 400
    type: invalid_request
    when: The request body is not valid JSON
  - code: unsupported_body
    status: 400
    type: invalid_request
    when: The request body uses an unsupported charset or encoding
  - code: metadata_too_large
    status: 400
    type: invalid_request
    when: The merged metadata would exceed 50 keys; remove keys by setting them to ""
  - code: payload_too_large
    status: 400
    type: invalid_request
    when: The request body is over 256 KB
  - code: invalid_cursor
    status: 400
    type: invalid_request
    when: The `starting_after` / `ending_before` object does not exist
  - code: invalid_api_version
    status: 400
    type: invalid_request
    when: Unknown `PletoPay-Version` header value
  - code: expiry_out_of_range
    status: 400
    type: invalid_request
    when: Payment expiry is outside the allowed window
  - code: resource_missing
    status: 400
    type: invalid_request
    when: A referenced object (customer, payment, organization) does not exist
  - code: idempotency_key_required
    status: 400
    type: invalid_request
    when: The endpoint requires an `Idempotency-Key` header
  - code: idempotency_key_invalid
    status: 400
    type: invalid_request
    when: The `Idempotency-Key` is empty, too long or not printable ASCII
  - code: invalid_beneficiary
    status: 400
    type: invalid_request
    when: The beneficiary account could not be verified
  - code: account_not_resolved
    status: 400
    type: invalid_request
    when: Name enquiry could not resolve the account
  - code: insufficient_funds
    status: 400
    type: invalid_request
    when: The available balance does not cover the transfer plus fees (`details` shows both)
  - code: invalid_url
    status: 400
    type: invalid_request
    when: The webhook endpoint URL is not an allowed https URL
  - code: invalid_event_type
    status: 400
    type: invalid_request
    when: A webhook endpoint subscribes to an unknown event type
  - code: invalid_endpoint
    status: 400
    type: invalid_request
    when: The webhook endpoint to replay to does not exist or is disabled
  - code: simulation_rejected
    status: 400
    type: invalid_request
    when: The simulated transfer was refused (e.g. the wrong amount for an exact-amount account)
  - code: webhook_endpoint_limit_reached
    status: 400
    type: invalid_request
    when: The organization has reached the webhook endpoint limit for this mode
  - code: invalid_plan
    status: 400
    type: invalid_request
    when: The plan does not exist or is inactive
  - code: invalid_start_date
    status: 400
    type: invalid_request
    when: The subscription start date is invalid
  - code: invalid_period
    status: 400
    type: invalid_request
    when: The report, statement or export period is invalid (at most 366 days)
  - code: amount_below_minimum
    status: 400
    type: invalid_request
    when: The refund or transfer is below the minimum transfer (₦10.00, `details.minimum`)
  - code: amount_exceeds_refundable
    status: 400
    type: invalid_request
    when: The refund is larger than what is left to refund (`details.refundable`)
  - code: amount_too_large
    status: 400
    type: invalid_request
    when: The invoice total is too large
  - code: refund_destination_required
    status: 400
    type: invalid_request
    when: The original sender's account isn't known; pass `destination`
  - code: invalid_destination
    status: 400
    type: invalid_request
    when: The refund destination account could not be verified
  - code: invalid_split_rule
    status: 400
    type: invalid_request
    when: The split rule does not exist or is inactive
  - code: invalid_split
    status: 400
    type: invalid_request
    when: Split allocations are invalid (bad shares, duplicate subaccounts, inactive rule)
  - code: invalid_amount
    status: 400
    type: invalid_request
    when: Payment-link amounts are inconsistent, or a customer amount is outside the range
  - code: invalid_expiry
    status: 400
    type: invalid_request
    when: The expiry is in the past
  - code: invoice_total_zero
    status: 400
    type: invalid_request
    when: An invoice cannot be finalized with a zero total
  - code: invalid_due_date
    status: 400
    type: invalid_request
    when: An invoice cannot be finalized with a past due date
  - code: invalid_operation
    status: 400
    type: invalid_request
    when: The operation does not apply to this object (e.g. closing a dynamic account)
  - code: missing_credentials
    status: 401
    type: authentication_error
    when: "No `Authorization: Bearer` header"
  - code: invalid_api_key
    status: 401
    type: authentication_error
    when: Wrong, replaced (after its grace period) or retired key (deliberately indistinguishable)
  - code: invalid_credentials
    status: 401
    type: authentication_error
    when: The credentials are invalid
  - code: organization_inactive
    status: 401
    type: authentication_error
    when: The organization is suspended
  - code: publishable_key_not_allowed
    status: 401
    type: authentication_error
    when: A publishable key (`pk_…`) was sent as a bearer token; it only identifies the checkout popup integration. Use the secret key
  - code: insufficient_permissions
    status: 403
    type: permission_error
    when: The key or the user's role does not allow this
  - code: transfers_disabled
    status: 403
    type: permission_error
    when: Money-out isn't enabled for this organization and mode
  - code: funds_on_hold
    status: 403
    type: permission_error
    when: An operator hold freezes money-out for this organization
  - code: endpoint_disabled_by_pletopay
    status: 403
    type: permission_error
    when: Pletopay disabled this webhook endpoint; only support can re-enable it
  - code: beneficiary_blocked
    status: 403
    type: permission_error
    when: The destination bank account (payout, refund, settlement or subaccount) is on the Pletopay blocklist
  - code: test_mode_only
    status: 403
    type: permission_error
    when: A sandbox endpoint was called with a live key
  - code: risk_limit_exceeded
    status: 403
    type: permission_error
    when: A risk limit or a restricted merchant status blocks this money movement (`details` shows the limit)
  - code: compliance_verification_required
    status: 403
    type: permission_error
    when: Live money-out (or live access) needs an approved business verification
  - code: route_not_exposed
    status: 403
    type: permission_error
    when: The route isn't available
  - code: resource_missing
    status: 404
    type: not_found
    when: No such object in **your** data (other tenants’ ids also return this)
  - code: route_not_found
    status: 404
    type: not_found
    when: Unknown path
  - code: platform_restricted
    status: 409
    type: conflict
    when: Pletopay raised this customer's risk status; only Pletopay can lower it
  - code: account_blocked_by_pletopay
    status: 409
    type: conflict
    when: Pletopay blocked this virtual account; only support can close it
  - code: duplicate_reference
    status: 409
    type: conflict
    when: This `reference` is already used in this mode (payments, transfers, refunds and checkout sessions each keep references unique)
  - code: customer_exists
    status: 409
    type: conflict
    when: A customer with this email exists
  - code: dedicated_account_limit
    status: 409
    type: conflict
    when: The customer already has the maximum number of dedicated accounts
  - code: invalid_state_transition
    status: 409
    type: conflict
    when: The object is in a state that doesn't allow this
  - code: invalid_state
    status: 409
    type: conflict
    when: The object is in a state that doesn't allow this
  - code: concurrent_modification
    status: 409
    type: conflict
    when: The object changed while processing; retry
  - code: endpoint_disabled
    status: 409
    type: conflict
    when: Enable the webhook endpoint before sending a test
  - code: customer_blocked
    status: 409
    type: conflict
    when: The customer's risk status is `blocked`
  - code: subscription_exists
    status: 409
    type: conflict
    when: The customer already has a live subscription to this plan
  - code: subscription_canceled
    status: 409
    type: conflict
    when: The subscription is already canceled
  - code: report_not_ready
    status: 409
    type: conflict
    when: The report is still generating
  - code: report_expired
    status: 409
    type: conflict
    when: The report's file has expired
  - code: report_too_large
    status: 409
    type: conflict
    when: The report exceeds the row limit; use a shorter period
  - code: subaccount_inactive
    status: 409
    type: conflict
    when: The subaccount is not active
  - code: virtual_account_not_active
    status: 409
    type: conflict
    when: The virtual account is used, expired, blocked or closed and cannot receive a transfer
  - code: payment_not_refundable
    status: 409
    type: conflict
    when: Only succeeded or partially refunded payments can be refunded
  - code: payment_not_confirmed
    status: 409
    type: conflict
    when: The payment's credit is not yet fully confirmed
  - code: checkout_session_not_open
    status: 409
    type: conflict
    when: The checkout session is complete or expired
  - code: invoice_not_draft
    status: 409
    type: conflict
    when: Only draft invoices can be changed or finalized
  - code: invoice_not_open
    status: 409
    type: conflict
    when: The invoice's status doesn't allow this
  - code: invoice_payment_in_progress
    status: 409
    type: conflict
    when: A payment for the invoice is processing
  - code: invoice_changed
    status: 409
    type: conflict
    when: The invoice changed concurrently; retry
  - code: idempotency_request_in_progress
    status: 409
    type: idempotency_error
    when: A request with this `Idempotency-Key` is still running
  - code: idempotency_key_reused
    status: 422
    type: idempotency_error
    when: The `Idempotency-Key` was used with a different request
  - code: insufficient_funds
    status: 422
    type: invalid_request
    when: Ledger-level non-negative guard (defence in depth)
  - code: rate_limited
    status: 429
    type: rate_limit_error
    when: Too many requests; see `Retry-After`
  - code: reports_in_progress
    status: 429
    type: rate_limit_error
    when: Two reports are already being generated for this organization and mode
  - code: internal_error
    status: 500
    type: api_error
    when: Unexpected error, logged. Retrying with the same `Idempotency-Key` is safe
  - code: virtual_account_creation_failed
    status: 502
    type: api_error
    when: The virtual account was definitively refused upstream. **Nothing was created**; check the details or contact support
  - code: service_unavailable
    status: 503
    type: api_error
    when: A payment service Pletopay depends on is temporarily unavailable. **Nothing was sent or created**; retry later
  - code: service_paused
    status: 503
    type: api_error
    when: Pletopay has temporarily paused this operation (for example during a service incident). **Nothing was done**; retry later
