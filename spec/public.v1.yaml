    get:
      operationId: listRiskEvents
      parameters:
        - name: limit
          required: false
          in: query
          description: Number of objects to return
          schema:
            minimum: 1
            maximum: 100
            default: 10
            type: number
        - name: starting_after
          required: false
          in: query
          description: "Cursor: return objects created before this object id (older)"
          schema:
            type: string
        - name: ending_before
          required: false
          in: query
          description: "Cursor: return objects created after this object id (newer)"
          schema:
            type: string
        - name: created
          required: false
          in: query
          description: Filter on creation time, e.g. created[gte]=2026-01-01T00:00:00Z
          schema:
            $ref: "#/components/schemas/DateRangeFilter"
          style: deepObject
          explode: true
        - name: review_status
          required: false
          in: query
          schema:
            type: string
            enum:
              - open
              - cleared
              - confirmed
          description: Only risk events with this review status.
        - name: PletoPay-Version
          in: header
          description: Dated API version. Defaults to the version pinned on your organization.
          required: false
          schema:
            type: string
      responses:
        "200":
          description: A page of risk events, newest first, in `data`. Pass `meta.next_cursor` as `starting_after` to fetch the next page; it is `null` on the last one.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - message
                  - data
                  - meta
                properties:
                  status:
                    const: true
                  message:
                    type: string
                    description: Human-readable outcome
                    example: Request successful
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RiskEvent"
                  meta:
                    $ref: "#/components/schemas/ListMeta"
              example:
                status: true
                message: Risk events retrieved
                data:
                  - id: rsk_01J8Z5X7Q9K2M4N6P8R0S2T4W6
                    object: risk_event
                    livemode: false
                    type: high_value_payment
                    severity: medium
                    action: flagged
