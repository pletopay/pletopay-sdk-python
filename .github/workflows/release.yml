# Publishes to PyPI with trusted publishing when a vX.Y.Z tag is pushed. Configure the
# "pypi" environment and the trusted publisher for the `pletopay` project on PyPI first.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6f1a9ca0a2d7e8d7a1aa5d7f6b2a6b2d3a3cc8d6 # v7.1.1
        with:
          python-version: '3.12'
          # No dependency cache in the release build: a poisoned cache entry could end up in the
          # published distribution (zizmor cache-poisoning). CI keeps caching; this job is rare.
          enable-cache: false
      - run: uv pip install --system -e ".[dev]"
      - name: Check the tag matches pyproject.toml
        run: |
          test "v$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")" = "${GITHUB_REF_NAME}"
      - run: ruff check src tests scripts examples && mypy && pytest -q --ignore=tests/live
      - run: python -m build && python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
